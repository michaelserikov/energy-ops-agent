[project]
name = "energy-ops-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "pyarrow", "fastapi", "uvicorn"]
[project.optional-dependencies]
test = ["pytest", "httpx"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
